name: Windows Diagnostic Build

on:
  workflow_dispatch:
    inputs:
      target_ref:
        description: "Branch, tag, or SHA to build"
        required: true
        default: "codex/windows-startup-diagnostics"

permissions:
  contents: read

jobs:
  build-windows-portable:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.target_ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install dependencies
        run: pnpm install

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Build Windows executable
        env:
          CXXFLAGS: /std:c++17 /EHsc
        run: pnpm tauri build --target x86_64-pc-windows-msvc --no-bundle --ci

      - name: Package diagnostic portable ZIP
        shell: pwsh
        run: |
          $portableDir = "diagnostic-portable\NexDB-diagnostic-x64"
          New-Item -ItemType Directory -Force -Path $portableDir | Out-Null
          Copy-Item "target\x86_64-pc-windows-msvc\release\nexdb.exe" (Join-Path $portableDir "NexDB.exe") -Force
          Copy-Item "LICENSE" (Join-Path $portableDir "LICENSE") -Force
          Copy-Item "README.md" (Join-Path $portableDir "README.md") -Force
          Set-Content -Path (Join-Path $portableDir "portable.dbx") -Value "" -NoNewline
          Compress-Archive -Path (Join-Path $portableDir "*") -DestinationPath "NexDB-diagnostic-x64-portable.zip" -Force

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: NexDB-diagnostic-x64-portable
          path: NexDB-diagnostic-x64-portable.zip
