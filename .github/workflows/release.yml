name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  create-release:
    name: Create draft release
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate tag version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PACKAGE_VERSION="$(jq -r '.version' package.json)"
          CARGO_VERSION="$(sed -nE 's/^version = "([^"]+)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          WEB_VERSION="$(sed -nE 's/^version = "([^"]+)"/\1/p' crates/dbx-web/Cargo.toml | head -n 1)"
          if [ "${TAG_VERSION}" != "${PACKAGE_VERSION}" ] \
            || [ "${TAG_VERSION}" != "${CARGO_VERSION}" ] \
            || [ "${TAG_VERSION}" != "${WEB_VERSION}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app versions (package.json=${PACKAGE_VERSION}, dbx=${CARGO_VERSION}, dbx-web=${WEB_VERSION})"
            exit 1
          fi
          echo "version=${TAG_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --draft \
            --title "NexDB ${{ steps.version.outputs.version }}" \
            --generate-notes

  build:
    name: ${{ matrix.name }}
    needs: create-release
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_INCREMENTAL: "0"
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64 AppImage
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage
          - name: Linux arm64 AppImage
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            bundles: appimage
            asset_arch: arm64
          - name: macOS x64 DMG
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: dmg
          - name: macOS arm64 DMG
            os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
            asset_arch: arm64
          - name: Windows x64 NSIS
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
          - name: Windows arm64 NSIS
            os: windows-2022
            target: aarch64-pc-windows-msvc
            bundles: nsis

    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.97.1
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux system dependencies
        if: startsWith(matrix.os, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev xdg-utils

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./ -> target"
          shared-key: release-${{ matrix.target }}
          cache-on-failure: true

      - name: Build Tauri bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ startsWith(matrix.os, 'macos') && '-' || '' }}
        run: |
          pnpm tauri build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" --config src-tauri/tauri.release-ci.conf.json

      - name: Verify macOS ad-hoc signature
        if: startsWith(matrix.os, 'macos')
        shell: bash
        run: |
          set -euo pipefail
          DMG_PATH="$(find "target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
          if [ -z "${DMG_PATH}" ]; then
            echo "::error::No DMG was produced for ${{ matrix.target }}"
            exit 1
          fi
          MOUNT_POINT="${RUNNER_TEMP}/dmg-verify"
          mkdir -p "${MOUNT_POINT}"
          hdiutil attach -nobrowse -readonly "${DMG_PATH}" -mountpoint "${MOUNT_POINT}"
          trap 'hdiutil detach "${MOUNT_POINT}" >/dev/null 2>&1 || true' EXIT
          APP_PATH="$(find "${MOUNT_POINT}" -maxdepth 3 -name '*.app' | head -n 1)"
          if [ -z "${APP_PATH}" ]; then
            echo "::error::No .app bundle found inside ${DMG_PATH}"
            exit 1
          fi
          codesign --verify --deep --strict "${APP_PATH}"
          codesign -dv --verbose=2 "${APP_PATH}" 2>&1 | tee "${RUNNER_TEMP}/codesign.txt"
          grep -qi 'adhoc' "${RUNNER_TEMP}/codesign.txt"
          hdiutil verify "${DMG_PATH}"

      - name: Verify NSIS installer
        if: startsWith(matrix.os, 'windows')
        shell: pwsh
        run: |
          $installer = Get-ChildItem "target/${{ matrix.target }}/release/bundle/nsis" -Filter "*.exe" -File | Select-Object -First 1
          if ($null -eq $installer) {
            throw "No NSIS installer was produced for ${{ matrix.target }}"
          }
          Write-Host "Built $($installer.FullName)"

      - name: Upload release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          BUNDLE_ROOT="target/${{ matrix.target }}/release/bundle"
          case "${{ matrix.bundles }}" in
            appimage)
              ASSET="$(find "${BUNDLE_ROOT}/appimage" -maxdepth 1 -name '*.AppImage' | head -n 1)"
              ;;
            dmg)
              ASSET="$(find "${BUNDLE_ROOT}/dmg" -maxdepth 1 -name '*.dmg' | head -n 1)"
              ;;
            nsis)
              ASSET="$(find "${BUNDLE_ROOT}/nsis" -maxdepth 1 -name '*.exe' | head -n 1)"
              ;;
          esac
          if [ -z "${ASSET}" ]; then
            echo "::error::Built asset was not found for ${{ matrix.target }}"
            exit 1
          fi
          UPLOAD_PATH="${ASSET}"
          UPLOAD_NAME="$(basename "${ASSET}")"
          if [ "${{ matrix.asset_arch }}" = "arm64" ]; then
            UPLOAD_NAME="${UPLOAD_NAME/aarch64/arm64}"
          fi
          if [ "${UPLOAD_NAME}" != "$(basename "${ASSET}")" ]; then
            UPLOAD_DIR="${RUNNER_TEMP}/assets"
            mkdir -p "${UPLOAD_DIR}"
            cp "${ASSET}" "${UPLOAD_DIR}/${UPLOAD_NAME}"
            UPLOAD_PATH="${UPLOAD_DIR}/${UPLOAD_NAME}"
          fi
          echo "Uploading ${UPLOAD_NAME} (${UPLOAD_PATH})"
          gh release upload "${GITHUB_REF_NAME}" "${UPLOAD_PATH}" --repo "${GITHUB_REPOSITORY}" --clobber

  publish:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Publish draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release edit "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --draft=false
