name: Release NexDB plugin

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    uses: Mutantcat-Working-Group/NexDB/.github/workflows/plugin-release-reusable.yml@plugin-sdk-v1
    with:
      release-tag: ${{ github.event.release.tag_name }}
      package-command: dbx-plugin package .
      package-path: dist/*.dbxp
      metadata-path: dist/*.artifact.json
      plugin-cli-version: 0.1.2
      # Frontend-only plugins can publish one cross-platform package instead:
      # build-matrix: '{"include":[{"runner":"ubuntu-24.04","target":"universal"}]}'
